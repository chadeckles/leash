[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "leash"
dynamic = ["version"]
description = "Leash – AI Agent Identity, Authorization, and Audit Layer"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Chad Eckles" },
]
keywords = [
    "ai", "agents", "authorization", "audit", "security", "mcp",
    "langchain", "crewai", "policy", "openclaw", "guardrails",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Core: policy engine, CLI, SDK client, MCP proxy.  Kept small so hooks and
# `uv tool install leash` stay fast.
dependencies = [
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
# The HTTP server (`leash start`): API, dashboard, database, signed tokens.
server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "pydantic>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/chadeckles/leash"
Repository = "https://github.com/chadeckles/leash"
Documentation = "https://github.com/chadeckles/leash#readme"
Issues = "https://github.com/chadeckles/leash/issues"
Changelog = "https://github.com/chadeckles/leash/blob/main/CHANGELOG.md"

[project.scripts]
leash = "leash.cli:main"
leash-mcp-proxy = "leash.mcp_proxy:main"

[tool.hatch.version]
path = "src/leash/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/leash"]

[tool.hatch.build.targets.sdist]
include = ["src/leash", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
