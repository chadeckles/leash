# Coding-agent guardrails
#
# Used by `leash hook` for Claude Code, GitHub Copilot CLI, Cursor, Codex and
# OpenClaw (which also gets the extra rules in openclaw.yaml).
# Normal development work is allowed; destructive or credential-stealing
# actions are blocked; risky-but-legitimate actions ask you first.
#
# Rules are checked top to bottom and the first match wins, so put
# exceptions above the rules they override.
#
# `group:` ties a rule to a switch in `leash settings` (tamper, secrets,
# destructive, network, risky, outside_workspace).  Switching a group off
# skips its rules; rules without a group are always checked.  Test changes with:
#
#   leash policy test --local --agent claude-code -a shell.exec -r "git push --force"
#
# Actions: shell.exec, file.read, file.write, file.delete, file.search,
# web.fetch, web.search, agent.spawn, mcp.<server>.<tool>, tool.<name>.
# Resources are glob patterns; file paths are absolute. For shell.exec, the
# full command line and every sub-command (split on ; && || | and $(...))
# are each checked.
name: coding-agent
description: >-
  Guardrails for AI coding agents: block destructive commands, secret
  access and tampering with Leash or the agent's hooks; ask before
  publishing, force-pushing or writing outside the workspace.
priority: 10
mode: enforce
agents:
  - "claude-code*"
  - "copilot*"
  - "cursor*"
  - "codex*"
  - "openclaw*"
  - "claude-desktop*"
  - "windsurf*"
  - "vscode*"
  - "mcp-client*"

rules:
  # ── Tamper protection: Leash itself and the hosts' hook configuration ──
  # "file.[wd]*" matches file.write and file.delete.
  - action: "file.[wd]*"
    resource: "*/.leash/*"
    effect: deny
    group: tamper
    reason: "Agents may not modify Leash policies, keys or audit logs"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.claude/settings*.json"
    effect: deny
    group: tamper
    reason: "Agents may not edit their own hook/permission settings"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.copilot/hooks/*"
    effect: deny
    group: tamper
    reason: "Agents may not edit their own hooks"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.copilot/settings*.json"
    effect: deny
    group: tamper
    reason: "Agents may not edit their own hook/permission settings"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.cursor/hooks.json"
    effect: deny
    group: tamper
    reason: "Agents may not edit their own hooks"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.codex/hooks.json"
    effect: deny
    group: tamper
    reason: "Agents may not edit their own hooks"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.codex/config.toml"
    effect: deny
    group: tamper
    reason: "Agents may not edit their own hook/permission settings"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.github/hooks/*"
    effect: ask
    group: tamper
    reason: "Changing repository agent hooks needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*leash uninstall*"
    effect: deny
    group: tamper
    reason: "Agents may not remove Leash"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*leash settings*"
    effect: deny
    group: tamper
    reason: "Agents may not change Leash's protection settings; run `leash settings` yourself in a terminal"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*leash setup*"
    effect: deny
    group: tamper
    reason: "Agents may not re-run Leash setup; run `leash setup` yourself in a terminal"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*leash allow*"
    effect: deny
    group: tamper
    reason: "Agents may not approve their own Leash exceptions; run `leash allow` yourself in a terminal"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*leash mcp trust*"
    effect: deny
    group: tamper
    reason: "Agents may not trust MCP tools for you; run `leash mcp trust` yourself in a terminal"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*leash mcp unwrap*"
    effect: deny
    group: tamper
    reason: "Agents may not remove Leash from MCP servers"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/Claude/claude_desktop_config.json"
    effect: deny
    group: tamper
    reason: "Agents may not change which MCP servers your apps run"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/Code/User/mcp.json"
    effect: deny
    group: tamper
    reason: "Agents may not change which MCP servers your apps run"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.codeium/windsurf/mcp_config.json"
    effect: deny
    group: tamper
    reason: "Agents may not change which MCP servers your apps run"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.vscode/mcp.json"
    effect: ask
    group: tamper
    reason: "Adding MCP servers to a project needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*claude_desktop_config.json*"
    effect: ask
    group: tamper
    reason: "Shell access to MCP app settings needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*mcp_config.json*"
    effect: ask
    group: tamper
    reason: "Shell access to MCP app settings needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*.leash/*"
    effect: ask
    group: tamper
    reason: "Shell access to ~/.leash needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*.claude/settings*"
    effect: ask
    group: tamper
    reason: "Shell access to agent settings needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*.copilot/hooks*"
    effect: ask
    group: tamper
    reason: "Shell access to agent hooks needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*.cursor/hooks.json*"
    effect: ask
    group: tamper
    reason: "Shell access to agent hooks needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*.codex/hooks.json*"
    effect: ask
    group: tamper
    reason: "Shell access to agent hooks needs your approval"
    owasp: ["ASI03"]

  # ── Credentials and secrets ──
  - action: "file.*"
    resource: "*/.ssh/*"
    effect: deny
    group: secrets
    reason: "SSH keys are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.aws/credentials"
    effect: deny
    group: secrets
    reason: "Cloud credentials are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.config/gcloud/*"
    effect: deny
    group: secrets
    reason: "Cloud credentials are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.azure/*"
    effect: deny
    group: secrets
    reason: "Cloud credentials are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.kube/config"
    effect: deny
    group: secrets
    reason: "Cluster credentials are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.docker/config.json"
    effect: deny
    group: secrets
    reason: "Registry credentials are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.git-credentials"
    effect: deny
    group: secrets
    reason: "Git credentials are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.config/gh/hosts.yml"
    effect: deny
    group: secrets
    reason: "GitHub CLI tokens are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.netrc"
    effect: deny
    group: secrets
    reason: "Credentials are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.pypirc"
    effect: deny
    group: secrets
    reason: "Package registry tokens are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "file.*"
    resource: "*/.npmrc"
    effect: ask
    group: secrets
    reason: ".npmrc can contain registry tokens"
    owasp: ["LLM02"]
  - action: "file.*"
    resource: "*/.env"
    effect: ask
    group: secrets
    reason: ".env files usually contain secrets"
    owasp: ["LLM02"]
  - action: "file.*"
    resource: "*/.env.*"
    effect: ask
    group: secrets
    reason: ".env files usually contain secrets"
    owasp: ["LLM02"]
  - action: "shell.exec"
    resource: "*.ssh/id_*"
    effect: deny
    group: secrets
    reason: "SSH private keys are off-limits to agents"
    owasp: ["LLM02", "ASI03"]
  - action: "shell.exec"
    resource: "*.ssh/*"
    effect: ask
    group: secrets
    reason: "Shell access to ~/.ssh needs your approval"
    owasp: ["LLM02", "ASI03"]
  - action: "shell.exec"
    resource: "*.aws/credentials*"
    effect: deny
    group: secrets
    reason: "Cloud credentials are off-limits to agents"
    owasp: ["LLM02", "ASI03"]

  # ── Destructive commands ──
  - action: "shell.exec"
    resource: "rm -[rRf]* /"
    effect: deny
    group: destructive
    reason: "Recursive delete of the filesystem root"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "rm -[rRf]* /[*]"
    effect: deny
    group: destructive
    reason: "Recursive delete of the filesystem root"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "rm -[rRf]* ~*"
    effect: deny
    group: destructive
    reason: "Recursive delete of the home directory"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "rm -[rRf]* $HOME*"
    effect: deny
    group: destructive
    reason: "Recursive delete of the home directory"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "mkfs*"
    effect: deny
    group: destructive
    reason: "Formatting disks is never an agent task"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "dd *of=/dev/*"
    effect: deny
    group: destructive
    reason: "Raw writes to devices are never an agent task"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: ":(){*"
    effect: deny
    group: destructive
    reason: "Fork bomb"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "*curl *|*sh"
    effect: deny
    group: destructive
    reason: "Piping a download into a shell runs unreviewed code"
    owasp: ["ASI02", "LLM05"]
  - action: "shell.exec"
    resource: "*curl *|*sh -*"
    effect: deny
    group: destructive
    reason: "Piping a download into a shell runs unreviewed code"
    owasp: ["ASI02", "LLM05"]
  - action: "shell.exec"
    resource: "*wget *|*sh"
    effect: deny
    group: destructive
    reason: "Piping a download into a shell runs unreviewed code"
    owasp: ["ASI02", "LLM05"]
  - action: "shell.exec"
    resource: "*wget *|*sh -*"
    effect: deny
    group: destructive
    reason: "Piping a download into a shell runs unreviewed code"
    owasp: ["ASI02", "LLM05"]

  # ── Production data and cloud resources: never an unreviewed agent task ──
  # SQL keywords are matched in any letter case.
  - action: "shell.exec"
    resource: "*[Dd][Rr][Oo][Pp] [Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee]*"
    effect: deny
    group: production
    reason: "Destroying database data can't be undone; run it yourself if you mean it"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "*[Dd][Rr][Oo][Pp] [Tt][Aa][Bb][Ll][Ee]*"
    effect: deny
    group: production
    reason: "Destroying database data can't be undone; run it yourself if you mean it"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "*[Dd][Rr][Oo][Pp] [Ss][Cc][Hh][Ee][Mm][Aa]*"
    effect: deny
    group: production
    reason: "Destroying database data can't be undone; run it yourself if you mean it"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "*[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee] *"
    effect: deny
    group: production
    reason: "Destroying database data can't be undone; run it yourself if you mean it"
    owasp: ["ASI02"]
  - action: "shell.exec"
    resource: "prisma migrate reset*"
