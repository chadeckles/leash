  # The same statements sent to an MCP database tool (e.g. run_query {sql: ...}).
  - action: "mcp.*"
    effect: deny
    group: production
    reason: "Destroying database data can't be undone; run it yourself if you mean it"
    conditions:
      arg.sql: "*[Dd][Rr][Oo][Pp] [Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee]*"
    owasp: ["ASI02"]
  - action: "mcp.*"
    effect: deny
    group: production
    reason: "Destroying database data can't be undone; run it yourself if you mean it"
    conditions:
      arg.sql: "*[Dd][Rr][Oo][Pp] [Tt][Aa][Bb][Ll][Ee]*"
    owasp: ["ASI02"]
  - action: "mcp.*"
    effect: deny
    group: production
    reason: "Destroying database data can't be undone; run it yourself if you mean it"
