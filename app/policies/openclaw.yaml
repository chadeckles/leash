# Policy for OpenClaw (https://github.com/openclaw/openclaw)
#
# OpenClaw is a popular open-source personal AI assistant that can run shell
# commands, browse the web, read/write files, and manage multi-agent sessions.
# This policy governs what an OpenClaw agent may do through Leash.
#
# OpenClaw's built-in tools map directly to Leash action names:
#   exec, process, read, write, edit, apply_patch, browser, canvas,
#   web_search, web_fetch, memory_search, memory_get, sessions_send, etc.
#
# Usage:
#   leash agents register --name "openclaw-agent" --vendor openclaw
#
# Tune this policy to your comfort level. The defaults below are a
# reasonable starting point: read and search are allowed, writes and
# shell execution require explicit opt-in, and browser/canvas are blocked.

name: openclaw-policy
description: >-
  Balanced policy for OpenClaw personal AI assistants. Allows reads, web
  search, and session management. Denies exec, writes, and browser by
  default — uncomment rules to unlock them as needed.
priority: 20
agents:
  - "*openclaw*"
  - "*claw*"

rules:
  # ── File I/O ──────────────────────────────────────────────────────────
  - action: "read"
    effect: allow
    reason: "OpenClaw may read files in the workspace"

  - action: "write"
    effect: deny
    reason: "File writes are blocked — uncomment the allow rule below to enable"
    # To allow writes, change effect to 'allow' or add an observe rule first:
    # - action: "write"
    #   effect: observe
    #   observe_deny: false
    #   reason: "Shadow writes before enforcing"

  - action: "edit"
    effect: deny
    reason: "File edits are blocked — uncomment to enable"

  - action: "apply_patch"
    effect: deny
    reason: "File patches are blocked — uncomment to enable"

  # ── Shell execution ───────────────────────────────────────────────────
  - action: "exec"
    effect: deny
    reason: "Shell execution is blocked — this is the highest-risk tool"
    owasp:
      - "ASI06"
      - "LLM06"

  - action: "process"
    effect: deny
    reason: "Background processes are blocked"

  - action: "code_execution"
    effect: deny
    reason: "Sandboxed code execution is blocked"

  # ── Web ───────────────────────────────────────────────────────────────
  - action: "web_search"
    effect: allow
    reason: "OpenClaw may search the web"

  - action: "web_fetch"
    effect: allow
    reason: "OpenClaw may fetch web pages"

  - action: "x_search"
    effect: allow
    reason: "OpenClaw may search X/Twitter"

  # ── Browser & UI ─────────────────────────────────────────────────────
  - action: "browser"
    effect: deny
    reason: "Browser control is blocked — high risk, enables arbitrary web actions"
    owasp:
      - "ASI02"

  - action: "canvas"
    effect: deny
    reason: "Canvas/A2UI is blocked"

  # ── Memory ────────────────────────────────────────────────────────────
  - action: "memory_search"
    effect: allow
    reason: "OpenClaw may search its memory"

  - action: "memory_get"
    effect: allow
    reason: "OpenClaw may retrieve memory entries"

  # ── Multi-agent sessions ──────────────────────────────────────────────
  - action: "sessions_list"
    effect: allow
    reason: "OpenClaw may list active sessions"

  - action: "sessions_history"
    effect: allow
    reason: "OpenClaw may read session history"

  - action: "sessions_send"
    effect: allow
    reason: "OpenClaw may send messages between sessions"
    rate_limit:
      max_calls: 30
      window: 60

  - action: "sessions_spawn"
    effect: deny
    reason: "Spawning new agent sessions is blocked"

  - action: "session_status"
    effect: allow
    reason: "OpenClaw may check session status"

  # ── Automation & system ───────────────────────────────────────────────
  - action: "cron"
    effect: allow
    reason: "OpenClaw may schedule tasks and reminders"
    rate_limit:
      max_calls: 20
      window: 3600

  - action: "gateway"
    effect: deny
    reason: "Gateway control is blocked — prevents config changes"

  - action: "nodes"
    effect: deny
    reason: "Device node control is blocked"

  # ── Catch-all ─────────────────────────────────────────────────────────
  - action: "*"
    effect: deny
    reason: "Everything not explicitly allowed is denied"
