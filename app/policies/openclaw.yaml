# What is OpenClaw allowed to do?
#
# Change any line to allow or deny, then save. Leash picks it up instantly.
#   🔴 high risk   🟠 medium   🟢 low
# Not sure what a tool does? Run: leash scan openclaw
agent: openclaw

tools:
  # ── Files ─────────────────────────────────────────────
  read: allow                # 🟢 can read files in its workspace
  write: deny                # 🔴 can create or overwrite any file it can reach
  edit: deny                 # 🔴 can change the contents of existing files
  apply_patch: deny          # 🔴 can rewrite many files at once with a code patch
  # ── Running code ──────────────────────────────────────
  exec: deny                 # 🔴 can run any shell command on your computer
  process: deny              # 🔴 can start and control long-running background programs
  code_execution: deny       # 🔴 can write and run its own code
  # ── Web ───────────────────────────────────────────────
  web_search: allow          # 🟢 can search the web
  web_fetch: allow           # 🟠 can download any web page (which may contain hidden instructions)
  x_search: allow            # 🟢 can search posts on X/Twitter
  browser: deny              # 🔴 can drive a real web browser: click, type, and use sites you are logged in to
  canvas: deny               # 🟠 can draw interactive pages on your screen and paired devices
  # ── Memory and sessions ───────────────────────────────
  memory_search: allow       # 🟢 can search its long-term memory
  memory_get: allow          # 🟢 can read saved memory entries
  sessions_list: allow       # 🟢 can list its chat sessions
  sessions_history: allow    # 🟢 can read past conversations
  session_status: allow      # 🟢 can check its own status
  sessions_send: allow       # 🟠 can send messages to its other sessions and agents (max 30 per minute when allowed)
  sessions_spawn: deny       # 🔴 can start new AI agents that work on their own
  # ── System ────────────────────────────────────────────
  cron: allow                # 🟠 can schedule tasks that run later without you watching (max 20 per hour when allowed)
  gateway: deny              # 🔴 can change OpenClaw's own settings and restart it
  nodes: deny                # 🔴 can control your paired phones and other computers

everything_else: deny    # any tool not listed above
