# OpenClaw guardrails (https://github.com/openclaw/openclaw)
#
# Used by `leash install openclaw`, which adds a small plugin to OpenClaw that
# sends every tool call to `leash hook openclaw` before it runs.
#
# OpenClaw's file and shell tools (read, write, edit, apply_patch, exec) are
# mapped to the same actions as coding agents (file.read, file.write,
# shell.exec, ...), so the coding-agent policy's protections — secrets, SSH
# keys, `rm -rf ~`, curl | sh, writes outside the workspace — apply too.
# This file only adds rules for OpenClaw-specific tools and files.  Anything
# it doesn't mention falls through to the coding-agent policy.
#
# OpenClaw-only tools appear as `tool.<name>`: tool.gateway, tool.nodes,
# tool.cron, tool.message, tool.browser, tool.sessions_spawn, ...
# `leash audit tail` shows exactly what your assistant calls.
#
# Rules are checked top to bottom and the first match wins.  Test a change:
#   leash policy test --local --agent openclaw -a tool.cron
name: openclaw
description: >-
  Guardrails for the OpenClaw personal assistant: protect its config,
  plugins and channel credentials, and ask before it changes its own
  gateway, controls paired devices or schedules jobs that run without you.
priority: 20
mode: enforce
agents:
  - "openclaw*"

rules:
  # ── Tamper protection: OpenClaw's config and plugins (Leash is a plugin) ──
  - action: "file.[wd]*"
    resource: "*/.openclaw*/openclaw.json*"
    effect: deny
    reason: "The assistant may not edit OpenClaw's config (it controls plugins, including Leash)"
    owasp: ["ASI03"]
  - action: "file.[wd]*"
    resource: "*/.openclaw*/extensions/*"
    effect: deny
    reason: "The assistant may not change installed OpenClaw plugins"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*openclaw plugins*"
    effect: ask
    reason: "Changing OpenClaw plugins needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*openclaw config*"
    effect: ask
    reason: "Changing OpenClaw's config needs your approval"
    owasp: ["ASI03"]
  - action: "shell.exec"
    resource: "*.openclaw*/openclaw.json*"
    effect: ask
    reason: "Shell access to OpenClaw's config needs your approval"
    owasp: ["ASI03"]
  - action: "tool.gateway"
    effect: ask
    reason: "The gateway tool can change OpenClaw's config, restart or update it"
    owasp: ["ASI03"]

  # ── Secrets: channel logins and API keys ──
  - action: "file.*"
    resource: "*/.openclaw*/credentials/*"
    effect: deny
    reason: "OpenClaw's channel credentials are off-limits"
    owasp: ["LLM02", "ASI03"]
  - action: "shell.exec"
    resource: "*.openclaw*/credentials*"
    effect: deny
    reason: "OpenClaw's channel credentials are off-limits"
    owasp: ["LLM02", "ASI03"]
  - action: "file.read"
    resource: "*/.openclaw*/openclaw.json*"
    effect: ask
    reason: "OpenClaw's config can contain API keys"
    owasp: ["LLM02"]

  # ── Things a personal assistant does on its own: ask first ──
  - action: "tool.nodes"
    effect: ask
    reason: "Controlling paired devices (camera, screen, location, commands) needs your approval"
    owasp: ["ASI02"]
  - action: "tool.cron"
    effect: ask
    reason: "Scheduling jobs that run later without you needs your approval"
    owasp: ["ASI02"]

  # Sending messages is what an assistant is for, but cap runaway loops.
  # Change this to `effect: ask` to approve every outgoing message.
  - action: "tool.message"
    effect: allow
    reason: "Sending messages (rate-limited)"
    rate_limit:
      max_calls: 30
      window: 60

  # Everything else (browser, web, memory, sessions, file and shell work)
  # falls through to the coding-agent policy.
