services:
  leash:
    build: .
    container_name: leash-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # All state: leash.db, keys/ (incl. admin.key), policies/ (seeded from presets)
      - leash-data:/data
      # To manage policies from the host instead, mount a directory:
      # - ./policies:/data/policies:ro
    environment:
      # ── Security hardening (all recommended for production) ──
      - LEASH_REQUIRE_AUTH_REGISTER=true
      - LEASH_REQUIRE_AUTH_READ=true
      - LEASH_POLICY_REQUIRE_ADMIN=true
      - JWT_EXPIRATION_HOURS=168
      - LEASH_CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      # ── Audit export (optional) ──
      # - LEASH_WEBHOOK_URL=https://your-siem.example.com/ingest
      # - LEASH_AUDIT_SINK=/data/audit.jsonl
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  leash-data:
